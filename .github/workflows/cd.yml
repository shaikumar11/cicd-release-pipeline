name: CD

# Tagging a release (./scripts/release.sh patch && git push --follow-tags) runs this pipeline:
# build image -> deploy staging (automatic) -> deploy production (manual approval gate).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Deploy to staging with health check and auto-rollback
        run: ./scripts/deploy.sh staging "${{ github.ref_name }}"

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production   # configure required reviewers in repo Settings > Environments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Deploy to production with health check and auto-rollback
        run: ./scripts/deploy.sh production "${{ github.ref_name }}"
